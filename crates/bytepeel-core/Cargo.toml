[package]
name = "bytepeel-core"
description = "Zero-dependency recursive decoder and editor for encoded and binary data: hex, base64, PEM, JWT, gzip/zstd, DER/ASN.1, CBOR, MessagePack and schemaless protobuf, with confidence-ranked interpretations"
keywords = ["protobuf", "asn1", "cbor", "decoder", "jwt"]
categories = ["encoding", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
# bytepeel-core is zero-dependency by default. Codecs that need a third-party
# decoder are optional features (all pure Rust, no unsafe in our code).
miniz_oxide = { version = "0.8.9", optional = true, default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.8.2", optional = true }

[features]
default = []
# gzip and zlib layers.
deflate = ["dep:miniz_oxide"]
# Zstandard layers.
zstd = ["dep:ruzstd"]
