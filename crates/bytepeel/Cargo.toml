[package]
name = "bytepeel"
description = "Peel layers of encoding off binary data: hex, base64, PEM and schemaless protobuf, with JSON output built for AI agents"
keywords = ["protobuf", "base64", "decoder", "binary", "cli"]
categories = ["command-line-utilities", "encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bytepeel"
path = "src/main.rs"

[dependencies]
bytepeel-core = { path = "../bytepeel-core", version = "0.1.0" }
