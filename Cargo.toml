[workspace]
resolver = "3"
members = ["crates/bytepeel-core", "crates/bytepeel", "crates/bytepeel-wasm"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["Pinta365"]
repository = "https://github.com/pinta365/bytepeel"
rust-version = "1.87"

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo build --profile wasm --target wasm32-unknown-unknown -p bytepeel-wasm`:
# release, optimized for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
